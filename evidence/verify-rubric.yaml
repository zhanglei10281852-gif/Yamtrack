rubrics:
  - id: 1
    type: f2p
    text: 同一媒体条目的两个刷新任务交错时，较早快照晚提交不会覆盖较新事件日期，也不会删除较新快照新增的 content_number。
  - id: 2
    type: f2p
    text: 手动刷新、媒体状态变化、导入结束和周期刷新都遵守同一最新快照提交规则，不存在绕过代际保护的触发入口。
  - id: 3
    type: f2p
    text: 抓取或构建快照失败时，上一轮完整 Event 集合保持可见，失败任务不会执行基于不完整结果的清理，后续刷新可以接管。
  - id: 4
    type: f2p
    text: 事件保存或清理阶段发生异常时，不会留下半个新快照与半个旧快照混合发布，重试能够确定收敛。
  - id: 5
    type: f2p
    text: 不同媒体条目的刷新可独立推进，一个条目的旧任务不会阻塞或夺走另一个条目的提交权。
  - id: 6
    type: p2p
    text: 没有重叠且完整成功的刷新仍会更新日期并删除上游确实取消的旧剧集事件。
  - id: 7
    type: p2p
    text: 页面日历、iCalendar 下载和基于 Event 的通知读取保持现有可见结果与唯一性约束。
