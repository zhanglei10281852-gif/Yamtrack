rubrics:
  - id: 1
    type: f2p
    text: 每个周期导入计划具有稳定代际，Beat 发布的消息和对应任务结果可结构化追溯到创建时的计划，而非仅靠名称或字符串 user_id。
  - id: 2
    type: f2p
    text: 计划删除成功后，已经发布但尚未取得生产写入权的旧代际任务会确定终止，不修改媒体、不生成成功结果且不触发日历刷新。
  - id: 3
    type: f2p
    text: 删除与正在写入的任务并发时遵守明确的写入所有权，结果为完整结束或完整回退，不出现部分导入。
  - id: 4
    type: f2p
    text: 同名计划重建后只接受新代际消息；旧消息、旧执行结果和旧删除状态不会归入新计划的历史或写入路径。
  - id: 5
    type: f2p
    text: 删除事务失败或服务在关闭过程中重启时，计划和任务状态能够恢复到可确定且可重试的状态，不会既显示已删又继续静默写入。
  - id: 6
    type: p2p
    text: 未删除的周期计划仍按既有时间和来源执行，并在完整成功后刷新日历和显示导入摘要。
  - id: 7
    type: p2p
    text: 一次性导入以及现有 Trakt、Simkl、MAL、AniList、Kitsu 等来源的正常导入行为保持。
